name: tests

on:
  # Pushes to main, plus every pull request. Branch pushes are covered by the
  # PR run, so listing '**' here would only duplicate each check.
  push:
    branches: [main]
  pull_request:

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
